# Publishes the compiler in response to a Flight release.
#
# Flight dispatches `flight-release` with the version and commit it just published. This is the receiving
# half of that contract: it proves the compiler still passes its whole gate at the revision the dispatch
# names, proves the artifact a consumer would install, and only then publishes -- and only when a run was
# armed to. A manual dispatch carries the same two facts, so a delivery that is lost is recovered by
# re-sending them rather than by releasing by hand.
#
# The version it publishes is the one the checkout declares, not one derived from the Flight version: the
# version bump is a reviewed change in this repository, and a bridge that computed versions would be a
# second place for the release model to live. Authority, ordering, recovery, and the sending-side change
# Flight still needs are documented in docs/release-bridge.md.
name: Release bridge

on:
  repository_dispatch:
    types: [flight-release]
  workflow_dispatch:
    inputs:
      flight_version:
        description: Flight version that was published
        required: true
        type: string
      flight_commit:
        description: Flight commit that version was published from
        required: true
        type: string
      dry_run:
        default: true
        description: Rehearse the whole pipeline without publishing
        type: boolean

permissions:
  contents: read

# One publishing lane for the whole repository, shared with the Release workflow, so the bridge and a
# manual release can never publish at the same time. Not cancellable: a publish that has begun is not
# safely resumable from the middle, and a cancelled gate is not a passed gate.
concurrency:
  group: release-global
  cancel-in-progress: false

jobs:
  release:
    name: Verify the dispatcher and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestation: npm signs the publish against the workflow identity. Read-only
      # contents is all this job can otherwise do.
      id-token: write
    env:
      # The dispatched facts reach the shell through the environment and nowhere else. They arrive from
      # another repository, so interpolating them into a shell body would be an injection surface; every
      # step below reads the variable, never the payload.
      FLIGHT_VERSION: ${{ github.event.client_payload.version || inputs.flight_version }}
      FLIGHT_COMMIT: ${{ github.event.client_payload.commit || inputs.flight_commit }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the dispatched facts
        run: |
          if ! printf '%s' "$FLIGHT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Flight version is not a release version: $FLIGHT_VERSION" >&2
            exit 1
          fi
          if ! printf '%s' "$FLIGHT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Flight commit is not a full revision: $FLIGHT_COMMIT" >&2
            exit 1
          fi
          echo "Flight ${FLIGHT_VERSION} at ${FLIGHT_COMMIT}; dry run ${DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"

      # The whole gate first, from a cold tree, before anything is published.
      - run: npm ci
      - run: npm run ci

      # The artifact a consumer would install, still before the registry has a copy of it.
      - run: npm run smoke

      # Idempotency: a release is identified by the version it publishes, so a redelivery of the same
      # event -- or a recovery run after a partial failure -- finds the version already there and stops
      # without failing. Reading the public registry needs no credential.
      - name: Skip when this compiler version is already published
        run: |
          version="$(node -p "require('./packages/tool-compiler/package.json').version")"
          if npm view "@flighthq/tool-compiler@${version}" version > /dev/null 2>&1; then
            echo "@flighthq/tool-compiler ${version} is already published; nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.DRY_RUN != 'true' && env.SKIP_PUBLISH != 'true'
        run: npm publish --access public --provenance
        working-directory: packages/tool-compiler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Rehearsed
        if: env.DRY_RUN == 'true'
        run: echo "Rehearsed the release of @flighthq/tool-compiler; nothing was published." >> "$GITHUB_STEP_SUMMARY"
