# Pull-request and main-branch gate.
#
# The sweep is split into independent jobs so a failure names its own lane and the slow lanes run in
# parallel with the fast ones. Within a job every gate step carries `if: always()`, preserving the
# property `npm run check` has locally: these gates are independent, so stopping at the first failure
# would hide the rest.
#
# `pack:check` builds before it inspects, so the artifact lane needs no separate build step.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel-runtime:
    name: Bazel runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain_config: local-posix
          - os: macos-latest
            toolchain_config: local-posix
          - os: windows-latest
            toolchain_config: local-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-bazel 0.19.0 is pinned so the build bootstrap is reproducible as well as the Bazel version.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: bazel-runtime-${{ matrix.os }}
          module-root: flight-cpp
          repository-cache: true
      - name: Build and test runtime
        working-directory: flight-cpp
        run: bazel --config=${{ matrix.toolchain_config }} --config=ci test //...
      - name: Run Bazel performance smoke gate
        if: matrix.os == 'ubuntu-latest'
        working-directory: flight-cpp
        run: bazel --config=${{ matrix.toolchain_config }} --config=release test //benchmarks:runtime_benchmark

  cpp-runtime:
    name: C++ runtime (${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=g++ -DFLIGHT_CPP_BUILD_BENCHMARKS=ON
          - compiler: GCC ASan+UBSan
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DFLIGHT_CPP_ENABLE_SANITIZERS=ON
          - compiler: Clang
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=clang++
          - compiler: Clang shared ABI
            os: ubuntu-latest
            cmake-args: -DCMAKE_CXX_COMPILER=clang++ -DBUILD_SHARED_LIBS=ON
          - compiler: AppleClang
            os: macos-latest
            cmake-args: -DCMAKE_CXX_COMPILER=clang++
          - compiler: MSVC
            os: windows-latest
            cmake-args: ''
          - compiler: MSVC shared ABI
            os: windows-latest
            cmake-args: -DBUILD_SHARED_LIBS=ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure runtime
        run: cmake -S flight-cpp -B flight-cpp/build -DBUILD_TESTING=ON -DFLIGHT_CPP_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}
      - name: Build runtime
        run: cmake --build flight-cpp/build --config Release
      - name: Test runtime
        run: ctest --test-dir flight-cpp/build --build-config Release --output-on-failure
      - name: Install runtime
        run: cmake --install flight-cpp/build --config Release --prefix flight-cpp/out/install
      - name: Configure installed consumer
        run: cmake -S flight-cpp/tests/consumer -B flight-cpp/out/consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/flight-cpp/out/install -DCMAKE_BUILD_TYPE=Release
      - name: Build installed consumer
        run: cmake --build flight-cpp/out/consumer --config Release
      - name: Test installed consumer
        run: ctest --test-dir flight-cpp/out/consumer --build-config Release --output-on-failure

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run packages:check
        if: always()
      - run: npm run exports:check
        if: always()
      - run: npm run docs:check
        if: always()
      - run: npm run order:check
        if: always()
      - run: npm run license:check
        if: always()
      - run: npm run api:check
        if: always()
      - run: npm run format:check
        if: always()
      - run: npm run lint
        if: always()

  cpp-conformance:
    name: C++ whole-corpus conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run golden:check
        if: always()
      - run: npm run cpp:abi:check
        if: always()
      - run: npm run cpp:build:check
        if: always()
      - run: npm run cpp:exceptions:check
        if: always()
      - run: npm run cpp:release:check
        if: always()
      - run: npm run compile:check
        if: always()
      - run: npm run oracle:check
        if: always()

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      # The isolated lane proves package boundaries; the aggregate lane measures coverage against the
      # ratchets. Neither subsumes the other, so both run even when the first fails.
      - run: npm run test:packages
        if: always()
      - run: npm run test:coverage
        if: always()

  artifact:
    name: Package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run pack:check

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The commit-msg hook enforces this locally and can be bypassed, so the pull request checks the
      # range itself. Full history is what makes the base..head range resolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
